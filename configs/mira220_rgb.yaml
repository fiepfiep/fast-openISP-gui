module_enable_status:                 # do NOT modify modules order
  dpc: True
  blc: True
  aaf: True
  awb: True
  cnf: True
  cfa: True
  ccm: True
  gac: True
  csc: True
  nlm: True
  bnf: True
  ceh: False
  eeh: True
  fcs: True
  hsc: True
  bcc: True
  scl: False

hardware:
  raw_width: 1600
  raw_height: 1400
  raw_bit_depth: 12
  bayer_pattern: rggb


# -------------------- Module Algorithms Parameters --------------------

dpc:
  diff_threshold: 30

blc:
  bl_r: 20                             # a subtractive value, not additive!
  bl_gr: 20
  bl_gb: 20
  bl_b: 20
  alpha: 0                            # x1024
  beta: 0                             # x1024

aaf: ~

awb:
  r_gain: &r_gain 1624                # x1024
  gr_gain: 1024                       # x1024
  gb_gain: 1024                       # x1024
  b_gain: &b_gain 2000                # x1024

cnf:
  diff_threshold: 0
  r_gain: *r_gain                     # x1024
  b_gain: *b_gain                     # x1024

cfa:
  mode: malvar

ccm:
  ccm:
    - [1280,-122,-153,0]
    - [-563,1536,-30,0]
    - [235,-573,1331,0]

gac:
  gain: 260                           # x256
  gamma: 0.42

csc: ~

nlm:
  search_window_size: 9
  patch_size: 3
  h: 5                               # larger value has stronger smoothing effect

bnf:
  intensity_sigma: 0.3                # larger value has stronger smoothing effect
  spatial_sigma: 0.3                  # larger value has stronger smoothing effect

ceh:
  tiles: [4, 6]
  clip_limit: 0.01

eeh:
  edge_gain: 1200                      # x256
  flat_threshold: 4                   # delta <= flat_threshold: set delta to 0
  edge_threshold: 8                   # delta > edge_threshold: increase delta by edge_gain
  delta_threshold: 20

fcs:
  delta_min: 8
  delta_max: 32

hsc:
  hue_offset: 0                       # in degree
  saturation_gain: 250                # x256

bcc:
  brightness_offset: 0
  contrast_gain: 256                  # x256

scl:
  width: 1600
  height: 1400
