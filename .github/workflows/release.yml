# Build the Windows exe and publish a GitHub release when a version tag is pushed.
#   git tag v0.2.0 && git push mygithub v0.2.0
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build exe
        shell: pwsh
        run: .\scripts\build_exe.ps1
      - name: Package zip
        shell: pwsh
        run: .\scripts\package_release.ps1
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/fast-openISP-*-win64.zip
          generate_release_notes: true
          body: |
            Windows build of the fast-openISP GUI.

            **Download** `fast-openISP-<version>-win64.zip`, unzip, and run `fast-openISP.exe` (no Python needed).
            The zip contains the exe, the bundled YAML configs and sample raw images
            (`mikros110.tiff`, 10-bit BGGR; `test.RAW`, 10-bit RGGB; `mira220_rgb.dng`, 12-bit GRBG).

            Documentation: https://fiepfiep.github.io/fast-openISP-gui/

            Author: Philippe Baetens. Based on [fast-openISP](https://github.com/QiuJueqin/fast-openISP)
            by Qiu Jueqin (MIT) and [openISP](https://github.com/cruxopen/openISP).
