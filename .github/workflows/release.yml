# Build the Windows exe and publish a GitHub release when a version tag is pushed.
#   git tag v0.2.0 && git push mygithub v0.2.0
# Release notes come from the matching "## v<version>" section of docs/release-notes.md.
# Re-running for an existing tag (Actions → release → Run workflow, pick the tag) updates
# that release's notes and assets.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build exe
        shell: pwsh
        run: .\scripts\build_exe.ps1
      - name: Package zip
        shell: pwsh
        run: .\scripts\package_release.ps1
      - name: Release notes and checksum
        shell: pwsh
        run: |
          uv run python scripts/release_notes.py "${{ github.ref_name }}" > dist/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw "No release notes for ${{ github.ref_name }}" }
          Get-ChildItem dist/fast-openISP-*-win64.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }
      - uses: softprops/action-gh-release@v2
        with:
          name: fast-openISP GUI ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/fast-openISP-*-win64.zip
            dist/fast-openISP-*-win64.zip.sha256
